apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: taskboard6-backups
  labels:
    app.kubernetes.io/name: backups
    app.kubernetes.io/part-of: taskboard6
    app.kubernetes.io/managed-by: gitops-app
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
    argocd.argoproj.io/sync-wave: '1'
spec:
  seaweedRef:
    name: taskboard6-backups
  identityRef:
    name: taskboard6-backups
  secretRef:
    name: taskboard6-backups-app
    accessKeyField: accessKeyId
    secretKeyField: secretAccessKey
  reclaimPolicy: Retain
